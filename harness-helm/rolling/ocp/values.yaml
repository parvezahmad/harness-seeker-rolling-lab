replicaCount: 2

dockerconfigjson: "<+artifact.dockerConfigJsonSecret>"

image:
  repository: "<+artifact.imagePath>"
  tag: "<+artifact.tag>"
  pullPolicy: Always

environment: dev

healthStatus: healthy

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi
